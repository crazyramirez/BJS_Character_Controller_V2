<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BJS Character Controller V2</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    #char-swap {
      position: fixed;
      top: 12px;
      right: 50%;
      transform: translateX(50%);
      z-index: 50;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(10, 10, 20, 0.6);
      backdrop-filter: blur(8px);
      font-family: 'Outfit', sans-serif;
      color: #e8e8f0;
      font-size: 13px;
    }

    #char-swap label {
      opacity: 0.7;
      font-weight: 600;
    }

    #char-swap select,
    #char-swap button {
      background: rgba(255, 255, 255, 0.08);
      color: #e8e8f0;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 5px 8px;
      font: inherit;
      font-size: 9px;
      cursor: pointer;
    }

    #char-swap button:hover,
    #char-swap select:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    #char-swap select {
      color-scheme: dark;
    }

    #char-swap select option {
      background: #14141f;
      color: #e8e8f0;
    }
  </style>
</head>

<body>

  <div id="loading">
    <h1>BJS Character Controller V2</h1>
    <p>BABYLONJS 9 · MIXAMO · AAA CONTROLLER</p>
    <div class="bar-bg">
      <div class="bar" id="bar"></div>
    </div>
    <div class="bar-label" id="bar-label">Initializing...</div>
  </div>

  <canvas id="c"></canvas>

  <!-- MOBILE TOUCH CONTROLS -->
  <div id="mobile-ctrls">
    <div id="joystick-zone">
      <div id="joystick-ring">
        <div id="joystick-knob"></div>
      </div>
    </div>
    <div id="action-btns">
      <button id="btn-sprint" class="touch-btn">SPRINT</button>
      <button id="btn-jump" class="touch-btn">JUMP</button>
      <button id="btn-roll" class="touch-btn">ROLL</button>
      <button id="btn-crouch" class="touch-btn">CROUCH</button>
      <button id="btn-act" class="touch-btn">ACT</button>
      <button id="btn-spell" class="touch-btn">SPELL</button>
    </div>
  </div>

  <div id="xhair"></div>
  <div id="combo"></div>

  <!-- RUNTIME CHARACTER SWAP -->
  <div id="char-swap">
    <select id="char-preset">
      <option value="character_animated_1.glb">Character 1</option>
      <option value="character_animated_2.glb">Character 2</option>
      <option value="character_animated_3.glb">Character 3</option>
      <option value="character_animated_4.glb">Character 4 (NO ANIMS)</option>
      <option value="character_animated_5.glb">Character 5 (NO ANIMS)</option>
    </select>
    <button id="char-import-btn" type="button">Import GLB</button>
    <input id="char-import-file" type="file" accept=".glb" hidden>
    <button id="char-merge-anim-btn" type="button"
      title="Merge assets/animations.glb into the current character (server)">Merge Anims</button>
  </div>

  <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
  <script src="https://cdn.babylonjs.com/inspector/babylon.inspector.bundle.js"></script>

  <!-- Character Controller V2 - Custom Scripts -->
  <script src="js/character-controller.js?v=2.4"></script>
  <script src="js/ui/custom-hud.js?v=2.4"></script>
  <script src="js/ui/custom-pointer.js?v=2.4"></script>
  <script src="js/examples/app.js?v=2.4"></script>
</body>

</html>
